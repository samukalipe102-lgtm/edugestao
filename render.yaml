# Render Blueprint — EduGestão
# Cria automaticamente: 1 banco PostgreSQL + 1 web service Next.js.
# O DATABASE_URL é ligado automaticamente ao banco. As tabelas e o admin
# são criados no build (scripts/build.mjs).
#
# Como usar:
#   1. Render Dashboard -> New -> Blueprint -> conecte este repositório.
#   2. Preencha os valores marcados como "sync: false" (senha do admin, etc.).
#   3. Apply. O Render cria o banco e o site e faz o deploy.

databases:
  - name: edugestao-db
    databaseName: edugestao
    plan: free

services:
  - type: web
    name: edugestao
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    envVars:
      # Conexão com o banco: preenchida automaticamente pelo Render.
      - key: DATABASE_URL
        fromDatabase:
          name: edugestao-db
          property: connectionString
      # Segredo do NextAuth: gerado automaticamente pelo Render.
      - key: NEXTAUTH_SECRET
        generateValue: true
      # URL pública do site: defina após o primeiro deploy (ex.: https://edugestao.onrender.com)
      # e faça "Manual Deploy" novamente, ou preencha já se souber o domínio.
      - key: NEXTAUTH_URL
        sync: false
      # Administrador inicial (criado no build). Defina uma senha forte.
      - key: ADMIN_EMAIL
        value: admin@edugestao.local
      - key: ADMIN_PASSWORD
        sync: false

# Render Blueprint — EduGestão (versão simples com SQLite)
# Não precisa de banco separado: o banco é um arquivo no disco do serviço.
#
# Como usar:
#   1. Render Dashboard -> New -> Blueprint -> conecte este repositório.
#   2. Preencha apenas ADMIN_PASSWORD (senha do administrador).
#   3. Apply. Pronto — tabelas e admin são criados automaticamente.

services:
  - type: web
    name: edugestao
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    # Disco persistente para o arquivo SQLite (sobrevive a reinícios).
    disk:
      name: edugestao-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Banco SQLite em arquivo, no disco persistente. Sem configuração externa.
      - key: DATABASE_URL
        value: file:/var/data/edugestao.db
      # Segredo do NextAuth: gerado automaticamente pelo Render.
      - key: NEXTAUTH_SECRET
        generateValue: true
      # Administrador inicial (criado no build). Defina uma senha forte.
      - key: ADMIN_EMAIL
        value: admin@edugestao.local
      - key: ADMIN_PASSWORD
        sync: false
